<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Topos mark — horizon + sun + place -->
  <rect width="32" height="32" rx="7" fill="#0d4a5e"/>
  <!-- Sun — top semicircle arc rising above the horizon -->
  <path d="M12.67 16 A3.33 3.33 0 0 1 19.33 16" stroke="#faf9f7" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- Placemark wedge — filled triangle below the horizon -->
  <path d="M13.5 16 L18.5 16 L16 23.5 Z" fill="#faf9f7"/>
  <!-- Horizon line — painted last so it crisply bisects -->
  <path d="M8.5 16H23.5" stroke="#faf9f7" stroke-width="1.4" stroke-linecap="round"/>
</svg>
