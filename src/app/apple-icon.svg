<svg viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Topos mark — horizon + sun + place -->
  <rect width="180" height="180" rx="40" fill="#0d4a5e"/>
  <!-- Sun — top semicircle arc rising above the horizon -->
  <path d="M85.34 110 A24.67 24.67 0 0 1 134.67 110" stroke="#faf9f7" stroke-width="9.87" stroke-linecap="round" fill="none"/>
  <!-- Placemark wedge — filled triangle below the horizon -->
  <path d="M91.5 110 L128.5 110 L110 165.5 Z" fill="#faf9f7"/>
  <!-- Horizon line — painted last so it crisply bisects -->
  <path d="M54.5 110H166.5" stroke="#faf9f7" stroke-width="9.87" stroke-linecap="round"/>
</svg>
